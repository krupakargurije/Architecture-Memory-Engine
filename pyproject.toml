[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-memory-engine"
version = "0.1.0"
description = "Persistent Architectural Memory Layer for AI Coding Agents"
readme = "README.md"
authors = [{ name = "AME Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "javalang>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[project.scripts]
ame = "ame.mcp.server:main"
ame-api = "ame.api.app:main"
